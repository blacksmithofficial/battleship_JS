<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battleship</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="container">
        <!-- Start Menu -->
        <div id="start_menu" class="menu">
            <div>
                <h1>Battleship</h1>

                <!-- Phase 1 -->
                <div id="player_start">
                    <div style="display: flex; justify-content: center;">
                        <button id="start_button" class="menu_button">Start Game</button>
                    </div>
                </div>

                <!-- Phase 2 -->
                <div id="player_input" style="display: none;">
                    <!-- Username -->
                    <div>
                        <label for="">Enter Username Admiral</label><br><br>
                        <input id="player_name" type="text" placeholder="admiral" style="text-align: center;"><br><br>
                        <button id="username_button" class="menu_button">Next</button>
                    </div>
                </div>

                <!-- Phase 3 -->
                <div id="player_setup" style="display: none;">
                    <!-- Setup Grid (10x10) -->
                    <div>
                        <label for="" style="color: limegreen;">PLACE YOUR SHIPS</label>
                        <h3 id="ship_display"></h3>
                        <div id="setup_grid"></div><br>
                        <label id="player_name_display" for="" style="color: white;">ADMIRAL</label>
                        <!-- <button id="setup_button" class="menu_button">Next</button> -->
                    </div>

                </div>
                <p>Developed By: Blacksmith</p>
            </div>
        </div>

        <!-- Game -->
        <div id="game" style="display: none;">
            <!-- Shot Indicator -->
            <div class="shot_indicator" style="display: none;">
                <h3>MISSED SHOT</h3>
            </div>

            <!-- War Grid -->
            <div>
                <h1>Battleship</h1>
                <label for="" style="color: lawngreen;">DESTROY ENEMY FLEET </label><br><br>
                <div id="player_grid" style="display: none;"></div>
                <div id="war_grid"></div><br>
                <label id="grid_indicator" for="">ENEMY WATERS</label><br><br>
                <button id="scope_button" class="menu_button">Scope</button>
            </div>

            <!-- Shot Indicator -->
            <div class="shot_indicator" style="display: none;">
                <h3>MISSED SHOT</h3>
            </div>
        </div>

        <!-- End Menu -->
        <div id="end_menu" class="menu" style="display: none;">
            <h1>GAME OVER</h1>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
